<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SaaS Launch Video &amp; Motion Design | Pulse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #1a1a1a;
      --panel: #262626;
      --panel-hover: #2e2e2e;
      --active: #3a3a3a;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.14);
      --text: #f5f5f5;
      --text-2: #d6d6d6;
      --text-3: #a3a3a3;
      --text-4: #737373;
      --chip: #333333;
      --chip-hover: #3d3d3d;
      --btn: #2c2c2c;
      --save-bg: #f5f5f5;
      --save-fg: #171717;
      --ring: rgba(255, 255, 255, 0.12);
      --role-hook: #1baf7a;
      --role-problem: #eb6834;
      --role-product_intro: #256abf;
      --role-feature_reveal: #eda100;
      --role-demo: #e87ba4;
      --role-social_proof: #008300;
      --role-pricing: #4a3aa7;
      --role-cta: #e34948;
      --role-outro: #4d525a;
      --role-other: #a3a8b0;
      --font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--text); font-family: var(--font); }
    body { min-height: 100vh; -webkit-font-smoothing: antialiased; }
    button, input { font-family: inherit; }
    button { cursor: pointer; border: 0; background: none; color: inherit; }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }
    .tabular { font-variant-numeric: tabular-nums; }

    .page {
      max-width: 1720px;
      margin: 0 auto;
      padding: 28px 48px 96px;
    }
    @media (max-width: 900px) {
      .page { padding: 16px 16px 64px; }
    }

    /* ===== Header ===== */
    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 16px 16px;
      margin-bottom: 28px;
    }
    .brand-mark {
      position: relative;
      flex: none;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      margin-top: 4px;
      overflow: hidden;
      background: #2a2a2a;
      display: grid;
      place-items: center;
      font-weight: 600;
      font-size: 22px;
      color: var(--text);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.10);
    }
    .brand-mark img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .header-main { min-width: 0; flex: 1; }
    h1 {
      font-size: 28px;
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: -0.03em;
      color: var(--text);
    }
    .meta {
      margin-top: 6px;
      font-size: 14px;
      color: var(--text-3);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0;
    }
    .meta a.brand-link { font-weight: 500; color: var(--text-2); }
    .meta a.brand-link:hover { color: var(--text); text-decoration: underline; }
    .dot-sep { margin: 0 0.45em; color: var(--text-4); }
    .follow-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 8px;
      margin: 0 2px 0 8px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
      background: transparent;
      box-shadow: inset 0 0 0 1px var(--ring);
      vertical-align: middle;
    }
    .follow-btn:hover { background: var(--panel-hover); }
    .follow-btn svg { width: 14px; height: 14px; }
    .follow-btn.is-on { background: var(--panel); color: var(--text); }
    .ai-flag {
      color: var(--text-4);
      text-decoration: underline dotted;
      text-underline-offset: 3px;
      cursor: help;
    }
    .made {
      margin-top: 2px;
      font-size: 14px;
      color: var(--text-3);
    }
    .made .q { color: var(--text-4); }
    .made .who { font-weight: 500; color: var(--text-2); }

    .stats {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 20px;
      font-size: 12px;
    }
    .stats dt { color: var(--text-4); }
    .stats dd { font-weight: 500; color: var(--text-2); }
    .stat { display: flex; align-items: baseline; gap: 6px; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: none;
    }
    .icon-btn {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: var(--text-4);
    }
    .icon-btn:hover { background: var(--panel-hover); color: var(--text-3); }
    .icon-btn svg { width: 20px; height: 20px; }
    .save-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 12px;
      border-radius: 8px;
      background: var(--save-bg);
      color: var(--save-fg);
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(0,0,0,0.25);
    }
    .save-btn:hover { filter: brightness(0.95); }
    .save-btn svg { width: 16px; height: 16px; opacity: 0.7; }
    .save-btn.is-saved { background: #e5e5e5; }

    /* ===== Layout ===== */
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(340px, 28vw, 400px);
      gap: 32px;
      align-items: start;
    }
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .right { position: relative; top: auto; height: auto; max-height: none; }
    }

    /* ===== Video ===== */
    .player-wrap {
      position: relative;
      background: #0d0d0d;
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
    }
    .player-wrap video {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
      object-fit: contain;
    }
    .player-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-4);
      background:
        radial-gradient(80% 70% at 50% 40%, #2a2a2a 0%, #141414 70%);
      pointer-events: none;
    }
    .player-placeholder.hide { display: none; }
    .player-placeholder .play-orb {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      display: grid;
      place-items: center;
      color: var(--text-2);
    }
    .player-placeholder .play-orb svg { width: 28px; height: 28px; margin-left: 3px; }
    .player-placeholder .ph-title { font-size: 14px; font-weight: 500; color: var(--text-3); }
    .player-placeholder .ph-sub { font-size: 12px; color: var(--text-4); }

    .timecode {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      font-family: var(--mono);
      font-size: 13px;
    }
    .timecode .now { color: var(--text); }
    .timecode .dur { color: var(--text-4); }

    .overview {
      margin-top: 24px;
      max-width: 68ch;
      font-size: 16px;
      line-height: 1.65;
      color: var(--text-3);
    }
    .overview strong { font-weight: 500; color: var(--text-2); }

    .footage {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: var(--panel);
    }
    .footage .k { font-size: 12px; font-weight: 500; color: var(--text-2); }
    .footage .v { margin-top: 2px; font-size: 12px; color: var(--text-3); }

    /* ===== Right panel ===== */
    .right {
      position: sticky;
      top: 16px;
      height: calc(100vh - 32px);
      min-height: 480px;
      background: var(--panel);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
    }
    .tabs {
      display: flex;
      gap: 16px;
      padding: 14px 16px 0;
      border-bottom: 1px solid var(--border);
      flex: none;
    }
    .tab {
      position: relative;
      padding: 0 2px 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-4);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .tab:hover { color: var(--text-3); }
    .tab.active { color: var(--text); border-bottom-color: var(--text); }

    .tab-panel {
      display: none;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 8px;
    }
    .tab-panel.active { display: block; }

    /* ===== Sections / scenes ===== */
    .sec-list, .scene-list { list-style: none; display: grid; gap: 2px; }
    .sec-head {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: left;
      padding: 8px 12px;
      border-radius: 12px;
      color: var(--text);
    }
    .sec-head:hover { background: var(--panel-hover); }
    .sec-head .name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      font-weight: 600;
    }
    .sec-head .type { flex: none; font-size: 12px; color: var(--text-4); }
    .sec-head .meta-r {
      margin-left: auto;
      flex: none;
      font-size: 12px;
      color: var(--text-4);
    }
    .sec-head .chev {
      width: 16px; height: 16px;
      flex: none;
      color: var(--text-4);
      transition: transform 150ms ease;
    }
    .sec-head.open .chev { transform: rotate(180deg); }
    .scene-list { padding-left: 8px; }
    .scene-list.hidden { display: none; }

    .role-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex: none;
      background: var(--c, var(--role-other));
    }

    .scene {
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      transition: background 100ms ease;
    }
    .scene:hover { background: var(--panel-hover); }
    .scene.current { background: var(--active); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06); }
    .scene-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .scene-num {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      background: none;
      padding: 0;
    }
    .scene-role {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    .scene-kind { font-size: 12px; color: var(--text-4); }
    .scene-dur { margin-left: auto; font-size: 12px; color: var(--text-4); }

    .scene-desc {
      margin-top: 4px;
      padding-left: 26px;
      font-size: 14px;
      line-height: 1.55;
      color: var(--text-2);
    }
    .scene-cut {
      margin-top: 8px;
      padding-left: 26px;
      font-size: 12px;
      color: var(--text-4);
    }
    .scene-body { padding-left: 26px; }
    .scene-media { display: flex; gap: 12px; padding-left: 26px; margin-top: 6px; align-items: flex-start; }
    .scene-media .scene-desc { padding-left: 0 !important; margin: 0; flex: 1; }
    .scene-thumb { width: 124px; flex: none; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; background: #111; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); cursor: pointer; display: block; }
    .scene.current .scene-thumb { outline: 2px solid var(--role-hook); outline-offset: 1px; }
    .player-wrap iframe, .player-wrap #player { width: 100%; height: 100%; display: block; border: 0; background: #000; }
    .yt-poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
    .yt-poster-btn { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,0.25); border: 0; cursor: pointer; color: #fff; }
    .yt-poster-btn .play-orb { width: 72px; height: 72px; border-radius: 50%; background: rgba(0,0,0,0.6); display: grid; place-items: center; }
    .src-note { display: block; margin-top: 10px; font-size: 12px; color: var(--text-4); }
    .src-note a { color: var(--text-3); text-decoration: underline; }
    @media (max-width: 600px) { .scene-thumb { width: 112px; } }

    .chips {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 8px;
      border-radius: 6px;
      background: var(--chip);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-2);
      white-space: nowrap;
    }

    .prompt-block {
      margin-top: 6px;
      display: grid;
      gap: 6px;
      max-width: 100%;
      justify-items: start;
    }
    .ghost-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      align-self: start;
      width: max-content;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-2);
      background: #1f1f1f;
      box-shadow: inset 0 0 0 1px var(--ring);
    }
    .ghost-btn:hover { background: #2a2a2a; color: var(--text); }
    .ghost-btn.copied { color: #1baf7a; }
    .filming .fk { font-size: 12px; font-weight: 500; color: var(--text-2); }
    .filming .fv { margin-top: 2px; font-size: 12px; color: var(--text-3); }

    .recipe-row {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .recipe-list {
      display: none;
      margin-top: 12px;
      padding-left: 12px;
      border-left: 1px solid var(--border-strong);
      list-style: none;
      gap: 4px;
    }
    .recipe-list.open { display: grid; }
    .recipe-item {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
      font-size: 12px;
    }
    .recipe-item .t {
      flex: none;
      font-family: var(--mono);
      color: var(--text-4);
      background: none;
      padding: 0;
    }
    .recipe-item .t:hover { color: var(--text); }
    .recipe-item .k { flex: none; font-weight: 500; color: var(--text-3); }
    .recipe-item .v { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); }

    /* ===== Structure ===== */
    .struct { padding: 8px 8px 16px; }
    .timeline-wrap { margin: 8px 8px 20px; }
    .timeline-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-4);
      margin-bottom: 8px;
    }
    .timeline {
      display: flex;
      height: 28px;
      border-radius: 8px;
      overflow: hidden;
      background: #1a1a1a;
      gap: 2px;
    }
    .tl-block {
      height: 100%;
      min-width: 3px;
      background: var(--c, var(--role-other));
      position: relative;
    }
    .tl-block:hover { filter: brightness(1.15); }
    .tl-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-3);
    }
    .tl-legend span { display: inline-flex; align-items: center; gap: 6px; }

    .struct-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .struct-table td {
      padding: 10px 10px 10px 8px;
      border-bottom: 1px solid var(--border);
      color: var(--text-2);
      vertical-align: top;
    }
    .struct-table tr { cursor: pointer; }
    .struct-table tr:hover td { background: var(--panel-hover); }
    .struct-table .idx {
      width: 22px;
      color: var(--text-4);
      font-variant-numeric: tabular-nums;
      padding-right: 0;
    }
    .struct-table .sec-name {
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .struct-table .sec-sub {
      margin-top: 3px;
      font-size: 12px;
      color: var(--text-4);
      font-variant-numeric: tabular-nums;
    }

    /* ===== Style ===== */
    .style-pad, .sound-pad { padding: 12px 12px 20px; }
    .block-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-4);
      margin: 4px 0 10px;
    }
    .swatches {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 22px;
    }
    .swatch { width: 86px; }
    .swatch .chip-color {
      width: 100%;
      height: 48px;
      border-radius: 10px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
    }
    .swatch .hex {
      margin-top: 6px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-2);
    }
    .swatch .lab { font-size: 11px; color: var(--text-4); }
    .style-row { margin-bottom: 16px; }
    .style-row h3 { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .style-row p { font-size: 13px; line-height: 1.55; color: var(--text-3); }

    /* ===== Sound ===== */
    .sound-sec { margin-bottom: 22px; }
    .sound-sec h3 { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .sound-sec .notes { font-size: 13px; color: var(--text-3); margin-bottom: 8px; line-height: 1.5; }
    .sfx-list, .vo-list { list-style: none; display: grid; gap: 4px; }
    .sfx-item, .vo-item {
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-size: 13px;
      padding: 6px 8px;
      border-radius: 8px;
    }
    .sfx-item:hover, .vo-item:hover { background: var(--panel-hover); }
    .sfx-item .t, .vo-item .t {
      flex: none;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-4);
      background: none;
    }
    .sfx-item .t:hover, .vo-item .t:hover { color: var(--text); }
    .sfx-item .n, .vo-item .n { color: var(--text-2); }

    /* toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: #111;
      color: var(--text);
      border: 1px solid var(--border-strong);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
      z-index: 50;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .empty-hint {
      padding: 24px 12px;
      font-size: 13px;
      color: var(--text-4);
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="header" id="header"></header>
    <div class="layout">
      <section class="left" id="left"></section>
      <aside class="right" id="right"></aside>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script>
/* =============================================================================
   DATA SCHEMA — Claude: fill ONLY this object. Leave the rest of the file
   unchanged. video.src should be a relative path to the video file sitting
   next to this HTML (e.g. "MyFilm.mp4").

   DATA = {
     title: string,                  // page + H1, format "<Title> | <Brand>"
     brand: string,
     brandLogo: string,              // optional image URL; "" uses initial
     date: string,                   // e.g. "Nov 2026"
     length: string,                 // display, e.g. "0:40"
     lengthSeconds: number,          // used for timeline + timecode
     aiAnnotated: boolean,
     madeTeam: string,               // "made Team: …"
     studio: string,                 // "studio …"
     stats: {
       length: string,
       scenes: string,               // e.g. "8 · 5.0 s avg"
       productOnScreen: string,      // e.g. "0:08"
       featuresShown: string,        // e.g. "3"
       callToAction: string,         // e.g. "0:36 · 90%"
       voiceover: string             // e.g. "Yes"
     },
     video: { src: string, poster: string },
     overview: string,               // paragraph under the player; wrap the
                                     // lead sentence in <strong>…</strong>
     footageNeeded: string,          // "Estimated needs: …" or ""
     sections: [
       {
         id: string,
         name: string,
         type: string,               // Hook | Problem | Product intro |
                                     // Feature reveal | Demo | Social proof |
                                     // Pricing | CTA | Outro | Other
         scenesCount: number,
         duration: string,           // e.g. "7.0s"
         start: number,              // seconds
         end: number
       }
     ],
     scenes: [
       {
         id: number,                 // 1-based
         number: string,             // "01"
         sectionId: string,
         type: string,               // same role vocabulary as sections[].type
         kind: string,               // Title card | UI | Live action | …
         duration: string,           // e.g. "3.2s"
         start: number,              // seconds; click seeks here
         end: number,
         description: string,
         cutNote: string,            // "Cut → Cut · Static · …"
         techniques: string[],

    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function fmtTime(sec) {
  sec = Math.max(0, Number(sec) || 0);
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  const cs = Math.floor((sec % 1) * 100);
  return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}:${String(cs).padStart(2, "0")}`;
}
function parseStamp(str, fallback) {
  if (typeof fallback === "number") return fallback;
  if (!str) return 0;
  const m = String(str).trim().match(/^(\d+):(\d+)(?:\.(\d+))?$/);
  if (m) return (+m[1]) * 60 + (+m[2]) + (m[3] ? Number("0." + m[3]) : 0);
  const s = String(str).trim().match(/^(\d+(?:\.\d+)?)s$/);
  if (s) return +s[1];
  return parseFloat(str) || 0;
}
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 1600);
}

const YT_STATE = { player: null, ready: false, pending: null, timer: null };
function ytStart(seconds) {
  const poster = document.getElementById("yt-poster");
  const btn = document.getElementById("yt-poster-btn");
  if (poster) poster.remove();
  if (btn) btn.remove();
  if (YT_STATE.player) {
    if (YT_STATE.ready) { YT_STATE.player.seekTo(seconds, true); YT_STATE.player.playVideo(); }
    else YT_STATE.pending = seconds;
    return;
  }
  YT_STATE.pending = seconds;
  const make = () => {
    YT_STATE.player = new YT.Player("player", {
      videoId: DATA.video.youtubeId,
      playerVars: { autoplay: 1, playsinline: 1, rel: 0, modestbranding: 1, start: Math.floor(seconds) },
      events: {
        onReady: (e) => {
          YT_STATE.ready = true;
          if (YT_STATE.pending != null) e.target.seekTo(YT_STATE.pending, true);
          e.target.playVideo();
          YT_STATE.pending = null;
          clearInterval(YT_STATE.timer);
          YT_STATE.timer = setInterval(() => {
            const p = YT_STATE.player;
            if (!p || !p.getCurrentTime) return;
            const t = p.getCurrentTime() || 0;
            document.getElementById("tc-now").textContent = fmtTime(t);
            highlightAt(t);
          }, 250);
        }
      }
    });
  };
  if (window.YT && window.YT.Player) make();
  else {
    window.onYouTubeIframeAPIReady = make;
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(s);
  }
}
function seekTo(seconds, play) {
  if (DATA.video && DATA.video.youtubeId) {
    const t0 = Math.max(0, Number(seconds) || 0);
    highlightAt(t0);
    document.getElementById("tc-now").textContent = fmtTime(t0);
    if (play) ytStart(t0);
    else if (YT_STATE.ready) YT_STATE.player.seekTo(t0, true);
    return;
  }
  const v = document.getElementById("player");
  if (!v) return;
  const t = Math.max(0, Number(seconds) || 0);
  try { v.currentTime = t; } catch (e) {}
  highlightAt(t);
  if (play && DATA.video && DATA.video.src) {
    v.play().catch(() => {});
  }
}

function highlightAt(t) {
  let current = null;
  for (const sc of DATA.scenes) {
    if (t >= sc.start && t < sc.end) { current = sc; break; }
  }
  if (!current && DATA.scenes.length) {
    const last = DATA.scenes[DATA.scenes.length - 1];
    if (t >= last.start) current = last;
  }
  document.querySelectorAll(".scene.current").forEach((el) => el.classList.remove("current"));
  if (current) {
    const el = document.getElementById("scene-" + current.id);
    if (el) {
      el.classList.add("current");
      const list = el.closest(".scene-list");
      if (list && list.classList.contains("hidden")) {
        list.classList.remove("hidden");
        const head = list.previousElementSibling;
        if (head) { head.classList.add("open"); head.setAttribute("aria-expanded", "true"); }
      }
      if (el._was !== current.id) {
        const panel = document.getElementById("panel-scenes");
        if (panel && panel.classList.contains("active")) {
          const rect = el.getBoundingClientRect();
          const prect = panel.getBoundingClientRect();
          if (rect.top < prect.top + 8 || rect.bottom > prect.bottom - 8) {
            el.scrollIntoView({ block: "nearest", behavior: "smooth" });
          }
        }
      }
    }
  }
  highlightAt._id = current ? current.id : null;
}

function bind() {
  const v = document.getElementById("player");
  const ph = document.getElementById("ph");
  const tcNow = document.getElementById("tc-now");
  const tcDur = document.getElementById("tc-dur");

  document.getElementById("yt-poster-btn")?.addEventListener("click", () => ytStart(0));
  if (v && v.tagName === "VIDEO") {
    const hidePh = () => { if (DATA.video && DATA.video.src) ph.classList.add("hide"); };
    v.addEventListener("play", hidePh);
    v.addEventListener("playing", hidePh);
    v.addEventListener("loadeddata", () => {
      if (v.videoWidth) hidePh();
      if (v.duration && isFinite(v.duration)) tcDur.textContent = " / " + fmtTime(v.duration);
    });
    v.addEventListener("timeupdate", () => {
      tcNow.textContent = fmtTime(v.currentTime);
      highlightAt(v.currentTime);
    });
    v.addEventListener("error", () => {
      ph.classList.remove("hide");
      ph.querySelector(".ph-title").textContent = "Video could not be loaded";
      ph.querySelector(".ph-sub").textContent = DATA.video.src || "Missing DATA.video.src";
    });
    if (!DATA.video || !DATA.video.src) {
      ph.classList.remove("hide");
    }
  }

  document.getElementById("follow-btn")?.addEventListener("click", (e) => {
    const btn = e.currentTarget;
    const on = btn.classList.toggle("is-on");
    btn.innerHTML = icons.bell + (on ? " Following" : " Follow");
  });
  document.getElementById("save-btn")?.addEventListener("click", (e) => {
    e.currentTarget.classList.toggle("is-saved");
    toast(e.currentTarget.classList.contains("is-saved") ? "Saved" : "Removed from saved");
  });
  document.getElementById("copy-link")?.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText((DATA.video && DATA.video.sourceUrl) || location.href);
      toast("Link copied");
    } catch {
      toast("Could not copy link");
    }
  });

  document.getElementById("right").addEventListener("click", async (e) => {
    const tab = e.target.closest(".tab");
    if (tab) {
      const name = tab.dataset.tab;
      document.querySelectorAll(".tab").forEach((t) => {
        t.classList.toggle("active", t === tab);
        t.setAttribute("aria-selected", t === tab ? "true" : "false");
      });
      document.querySelectorAll(".tab-panel").forEach((p) => {
        p.classList.toggle("active", p.id === "panel-" + name);
      });
      return;
    }
    const head = e.target.closest(".sec-head");
    if (head) {
      const open = head.classList.toggle("open");
      head.setAttribute("aria-expanded", open ? "true" : "false");
      const list = document.getElementById("sec-scenes-" + head.dataset.sec);
      if (list) list.classList.toggle("hidden", !open);
      return;
    }
    const copy = e.target.closest(".copy-prompt");
    if (copy) {
      const sc = DATA.scenes.find((s) => String(s.id) === String(copy.dataset.scene));
      if (!sc) return;
      try {
        await navigator.clipboard.writeText(sc.prompt || "");
        copy.classList.add("copied");
        copy.textContent = "Copied";
        toast("Prompt copied");
        setTimeout(() => { copy.classList.remove("copied"); copy.textContent = "Copy prompt"; }, 1400);
      } catch {
        toast("Could not copy prompt");
      }
      e.stopPropagation();
      return;
    }
    const rec = e.target.closest(".recipe-toggle");
    if (rec) {
      const list = document.getElementById("recipe-" + rec.dataset.scene);
      const open = list.classList.toggle("open");
      rec.setAttribute("aria-expanded", open ? "true" : "false");
      e.stopPropagation();
      return;
    }
    const rel = e.target.closest("[data-seek-rel]");
    if (rel) {
      const sc = DATA.scenes.find((s) => String(s.id) === String(rel.dataset.scene));
      const extra = parseStamp(rel.dataset.seekRel);
      seekTo((sc ? sc.start : 0) + extra, true);
      e.stopPropagation();
      return;
    }
    const abs = e.target.closest("[data-seek]");
    if (abs) {
      seekTo(abs.dataset.seek, true);
      e.stopPropagation();
      return;
    }
    const goto = e.target.closest("[data-goto]");
    if (goto) {
      const sc = DATA.scenes.find((s) => String(s.id) === String(goto.dataset.goto));
      if (sc) seekTo(sc.start, true);
      e.stopPropagation();
      return;
    }
    const scene = e.target.closest(".scene");
    if (scene) {
      const sc = DATA.scenes.find((s) => String(s.id) === String(scene.dataset.scene));
      if (sc) seekTo(sc.start, true);
    }
  });

  highlightAt(0);
}

renderHeader();
renderLeft();
renderRight();
bind();

(function applyHashTab() {
  const name = (location.hash || "").replace(/^#/, "");
  if (!["scenes", "structure", "style", "sound"].includes(name)) return;
  const tab = document.querySelector('.tab[data-tab="' + name + '"]');
  if (tab) tab.click();
})();
  </script>
</body>
</html>
